name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: api/Dockerfile.multi
          - service: notifier
            dockerfile: notifier/Dockerfile
    permissions:
      contents: read
      packages: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR n'accepte que des noms en minuscules (le repo contient des majuscules).
      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} (local, pour scanner)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:ci
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Scan Trivy ${{ matrix.service }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # gate bloquant sur les tags v* ; informatif sur les branches
          exit-code: ${{ env.IS_TAG == 'true' && '1' || '0' }}
          format: table

      - name: Login GHCR (tags seulement)
        if: env.IS_TAG == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On pousse l'image DEJA scannee (re-tag), pas un nouveau build.
      - name: Push ${{ matrix.service }} (tags seulement)
        if: env.IS_TAG == 'true'
        run: |
          docker tag "$IMAGE:ci" "$IMAGE:${{ github.ref_name }}"
          docker push "$IMAGE:${{ github.ref_name }}"

  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SIMULATION : la "machine cible" est le runner GitHub lui-meme (pas de VM/SSH).
      # La mecanique est celle d'un vrai deploiement : pull des images publiees, up -d.
      - name: Preparer la config (env + secret)
        run: |
          cp .env.example .env
          mkdir -p secrets
          openssl rand -hex 16 > secrets/db_password.txt

      - name: Deployer (compose pull && up -d)
        run: |
          docker compose pull api notifier
          docker compose up -d --no-build
          docker image prune -f

      - name: Verifier la stack deployee
        run: |
          for i in $(seq 1 30); do
            curl -sf localhost:8080/health && break || sleep 2
          done
          curl -sf -X POST localhost:8080/products \
            -H "Content-Type: application/json" \
            -d '{"name":"Deploy check","price_cents":100}'
          echo
          sleep 2
          docker compose logs notifier | grep "nouveau produit"

      - name: Logs en cas d'echec
        if: failure()
        run: docker compose logs --tail=50
